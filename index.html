<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>شکار کروسان</title><style>
*{box-sizing:border-box}body{margin:0;background:#17131b;color:white;font:14px Tahoma,Arial;display:flex;justify-content:center}#app{width:min(100vw,430px);padding:10px;display:grid;gap:8px}header{display:flex;justify-content:space-between;background:#29222e;border:1px solid #514456;border-radius:12px;padding:10px}b{color:#ffd477;font-size:18px}#f{height:min(74vh,690px);min-height:460px;position:relative;overflow:hidden;border:2px solid #66516b;border-radius:16px;background:radial-gradient(ellipse at 50% 15%,#443047,#201b2b 70%);touch-action:none}#p{position:absolute;width:min(62%,250px);height:auto;bottom:0;left:50%;transform:translateX(-50%);z-index:2;pointer-events:none}.c{position:absolute;width:58px;height:auto;z-index:3;pointer-events:none}#o{display:none;position:absolute;inset:0;z-index:5;background:#100d14e8;align-items:center;justify-content:center;text-align:center;padding:20px}.panel{background:#302638;border:1px solid #94779a;border-radius:16px;padding:22px;width:100%}button{border:0;border-radius:12px;background:#f4b94f;color:#241a10;font-weight:bold;padding:12px 25px;font-size:16px}#controls{display:flex;justify-content:center;gap:20px}#controls button{background:#392d40;color:white;border:1px solid #8b7191;width:75px;font-size:23px;padding:8px}small{text-align:center;color:#d8cbdc;line-height:1.7}
</style><div id="app"><header><span>امتیاز: <b id="s">۰</b></span><span>رکورد: <b id="b">۰</b></span></header><div id="f"><img id="p" src="boy.png"><div id="o"><div class="panel"><h2>🥐 بازی تموم شد!</h2><p>امتیاز تو: <b id="fs">۰</b></p><button id="r">شروع دوباره</button></div></div></div><small>دهان پسر را زیر کروسان ببر! با کشیدن انگشت یا دکمه‌های چپ و راست حرکت کن.</small><div id="controls"><button id="l">◀</button><button id="d">▶</button></div></div>
<script>
(()=>{let f=document.getElementById('f'),p=document.getElementById('p'),s=document.getElementById('s'),b=document.getElementById('b'),o=document.getElementById('o'),a=[],n=0,px=.5,last=0,spawn=0,run=1,best=0,raf;
try{best=+localStorage.cbBest||0}catch(e){}b.textContent=fa(best);
function fa(x){return(''+x).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d])}
function dim(){return [f.clientWidth,f.clientHeight,p.getBoundingClientRect().width,p.getBoundingClientRect().height]}
function pos(){let [w]=dim();p.style.left=px*w+'px'}
function move(v){px=Math.max(.16,Math.min(.84,px+v*.065));pos()}
function add(){let [w]=dim(),x=18+Math.random()*(w-94),im=new Image();im.src='croissant.png';im.className='c';im.style.left=x+'px';im.style.top='-85px';f.append(im);a.push({e:im,x,y:-85,v:125+Math.min(n*5,180)})}
function over(){run=0;cancelAnimationFrame(raf);document.getElementById('fs').textContent=fa(n);o.style.display='flex'}
function tick(t){if(!run)return;let dt=Math.min((t-last)/1e3,.04)||0;last=t;let [w,h,pw,ph]=dim(),mx=px*w-pw/2+pw*.59,my=h-ph+ph*.575;spawn+=dt;if(spawn>Math.max(.48,1.35-n*.018)){spawn=0;add()}for(let i=a.length-1;i>=0;i--){let q=a[i];q.y+=q.v*dt;q.e.style.top=q.y+'px';if(q.y+36>=my){if(Math.abs(q.x+29-mx)<Math.max(34,pw*.13)){q.e.remove();a.splice(i,1);s.textContent=fa(++n);if(n>best){best=n;b.textContent=fa(best);try{localStorage.cbBest=best}catch(e){}}}else{over();return}}}raf=requestAnimationFrame(tick)}
function faStart(){a.forEach(q=>q.e.remove());a=[];n=0;s.textContent='۰';px=.5;spawn=last=0;o.style.display='none';run=1;pos();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}
document.getElementById('l').onclick=()=>move(-1);document.getElementById('d').onclick=()=>move(1);document.getElementById('r').onclick=faStart;onkeydown=e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)};let drag=0;f.onpointerdown=e=>{if(e.target.closest('#o'))return;drag=1;f.setPointerCapture(e.pointerId);set(e)};f.onpointermove=e=>{if(drag)set(e)};f.onpointerup=f.onpointercancel=()=>drag=0;function set(e){let r=f.getBoundingClientRect();px=Math.max(.16,Math.min(.84,(e.clientX-r.left)/r.width));pos()}onresize=pos;p.onload=pos;pos();faStart()})();
</script></html>
